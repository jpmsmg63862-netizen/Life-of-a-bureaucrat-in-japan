function probability(power,target){return Math.round(cap(50+(power-target)*1.75,3,96))}

function resolveSecond(index){const options=[{delta:7,people:1,policy:5,note:'根拠と反対意見を整理した'},{delta:4,people:5,policy:1,note:'関係者との調整を重視した'},{delta:2,people:2,policy:4,note:'迅速な実行を重視した'}];let c=options[index];if(!c)return;effect({people:c.people,policy:c.policy,interview:2});let score=s.policy*.37+s.people*.27+s.analysis*.19+s.wellbeing*.17+s.interview*.40+c.delta+random(-17,17);let required=s.examType==='一般職'?54:59;let pass=score>=required;s.examResult=pass;s.examScore2=Math.round(score);s.lastResult={kind:'examSecond',pass,note:c.note};s.phase='examSecondResult';log(pass?'国家公務員採用試験に最終合格':'採用試験の第2段階は不合格');update()}
function retry(){if(s.examTry>=s.examMax||s.age>=35){s.phase='lastChance';update();return}s.age++;effect({wellbeing:-4,prep:12,academic:3,analysis:3});s.phase='examSelect';log('翌年の試験に向けて準備を再開');update()}
function startVisit(id){if(s.visitUsed.includes(id)||s.visitCount>=3)return;s.visitAgency=id;s.visitRound=0;s.visitPoints=0;s.visitNotes=[];s.phase='visitInterview';s.visitUsed.push(id);s.visitCount++;log(`${id}への官庁訪問を開始`);update()}

{label:'幅広い仕事に挑戦できる点を挙げる',sub:'志望理由の具体性が問われる',score:6,note:'仕事の幅広さを志望理由にした'},

let eligible=ranks.filter((x,j)=>j>0&&s.yearIn>=x[0]&&s.impact+s.trust*.36+s.integrity*.20+random(-16,12)>x[2]);let found=eligible.length?eligible[eligible.length-1][1]:s.rank;if(ranks.findIndex(x=>x[1]===found)>ranks.findIndex(x=>x[1]===s.rank)){s.rank=found;log(`${found}に昇進した`)}

case 'examRetry':d={tag:'採用試験 · 再挑戦',overline:'不合格からの選択',title:'もう一度、挑むか。',body:`<p>受験は${s.examTry}回目を終えた。単年の不合格が即ゲームオーバーになるわけではない。</p>`,choices:[{label:'翌年の試験に再挑戦する',sub:'学力・準備が上昇、年齢が1歳進む',act:retry,disabled:s.examTry>=s.examMax||s.age>=35},{label:'実務経験を積み別の採用ルートへ',sub:'数年間働き、経験者採用を検討',act:()=>{s.age+=5;effect({people:10,policy:7,analysis:4});s.phase='experience';log('民間等で実務経験を積んだ');update()},disabled:s.age>=45||s.lifetimeTries>=8},{label:'官僚への挑戦を終える',sub:'ゲームオーバー',act:()=>lose('国家公務員への挑戦を終えた')}],note:'ゲーム内の再受験回数は最大3回です。実際の受験制限ではありません。'};break;
case 'experience':d={tag:'社会人経験者ルート',overline:`${s.age}歳 · 再出発`,title:'実務経験は武器になる。',body:'<p>仕事で学んだ知識を活かすことにした。経験者採用は実際には募集機関・職種等で制度が異なる。</p>',choices:[{label:'経験者採用に挑戦する',sub:'試験・選考に戻る',act:()=>{s.examTry=0;startExam('経験者採用')}},{label:'今回は見送る',sub:'ゲームオーバー',act:()=>lose('採用への挑戦を終了した')}]};break;
case 'lastChance':d={tag:'挑戦の限界',overline:'試験からの再出発',title:'別の入口を探す。',body:'<p>通常ルートでの再受験上限に達した。経験を積んで採用に挑む道が残っている。</p>',choices:[{label:'経験者採用を検討する',sub:'年齢が進み、実務経験を積む',act:()=>{s.age+=5;s.examTry=0;effect({policy:8,people:10});s.phase='experience';log('経験者採用を目指す');update()},disabled:s.age>=45||s.lifetimeTries>=8},{label:'挑戦を終える',sub:'ゲームオーバー',act:()=>lose('採用試験で内定に至らなかった')}]};break;
case 'visitSelect':{const remain=agency.filter(x=>!s.visitUsed.includes(x.id));d={tag:'CHAPTER 07 · 官庁訪問',overline:`第${s.campaign+1}回 採用シーズン · 訪問${s.visitCount}/3`,title:'どの官庁を訪問する？',body:`<p>官庁ごとに扱う政策課題や求められる能力は異なる。1シーズンにつき最大3官庁を訪問できる。</p><p class="smallprint">政策理解・説明力・職務適性などをゲーム独自の評価モデルで判定します。</p>`,grid:true,choices:remain.map(a=>({label:a.id,sub:a.field,act:()=>startVisit(a.id)}))};break}
case 'visitInterview':{const a=agency.find(x=>x.id===s.visitAgency),round=s.visitRound;
let head=round===0?'第1面接：志望動機':round===1?'第2面接：政策課題':'最終面接：反論への対応';let t=round===0?`「なぜ${a.id}を志望しますか？」`:round===1?`${a.topic} 面接官：「${a.question}」`:'面接官：「あなたの提案には欠点があります。それでも進めるのですか？」';d={tag:'官庁訪問 · '+a.id,overline:`${head} · ${round+1}/3`,title:head,body:`<p class="biglead">${esc(t)}</p><p class="smallprint">採用結果には前段階の面接評価、あなたの能力値、偶然が影響します。</p>`,choices:visitOptions(a,round).map((c,i)=>({label:c.label,sub:c.sub,act:()=>visitChoice(i)}))};break}
case 'visitDecision':{const a=agency.find(x=>x.id===s.visitAgency);d={tag:'官庁訪問 · 最終判断',overline:a.id,title:'採用担当者からの連絡。',body:`<p>複数回の面接を終えた。評価はあなたの論理、対人、政策への関心、面接での応答に基づく。</p><div class="spot">面接記録：${s.visitNotes.map(esc).join(' ／ ')}</div>`,choices:[{label:'選考結果を見る',sub:'内々定か、採用見送りか',act:finalizeVisit}]};break}
case 'visitResult':{let ok=s.lastResult.pass;d={tag:'官庁訪問 · 結果',overline:s.lastResult.agency,title:ok?'採用内々定。':'採用見送り。',body:`<p class="biglead ${ok?'isgood':'isbad'}">${ok?'官僚になる道が開けた。':'最終合格しても採用されるとは限らない。'}</p><div class="mini-grid">${summaryRow('ゲーム内の面接評価',String(s.lastResult.score))}${summaryRow('訪問した官庁',String(s.visitCount)+' / 3')}</div>`,choices:[{label:ok?'採用を受諾する':'次の選択へ',sub:ok?'官僚編が始まる':'別の官庁を訪問するか決める',act:()=>{if(ok)hire();else failVisit()}}]};break}
case 'visitExhaust':d={tag:'官庁訪問 · 不採用',overline:'このシーズンの訪問を終えた',title:'3官庁、すべて採用見送り。',body:'<p>最終合格はした。しかし採用には至らなかった。翌年度に再び試験と官庁訪問に挑むこともできる。</p>',choices:[{label:'翌年度、改めて挑戦する',sub:'試験から再び始める',act:nextCampaign,disabled:s.campaign>=2||s.age>=35},{label:'官僚への挑戦を終える',sub:'ゲームオーバー',act:()=>lose('官庁訪問で採用に至らなかった')}]};break;
case 'hired':d={tag:'CHAPTER 08 · 採用',overline:'辞令 · 官僚人生の始まり',title:`${s.ministry}に採用。`,body:`<p class="biglead">あなたは国家公務員として霞が関で働くことになった。</p><div class="mini-grid">${summaryRow('採用官庁',s.ministry)}${summaryRow('採用時の年齢',String(s.age)+'歳')}${summaryRow('初任の役職',s.rank)}${summaryRow('官庁訪問回数',String(s.visitTotal+s.visitCount))}</div><p>ここで第一目標は達成。これからは政策立案、組織運営、異動、健康、そして昇進の選択が続く。</p>`,choices:[{label:'官僚人生を始める',sub:'約3年ごとに重要な決断が訪れる',act:()=>{s.visitTotal+=s.visitCount;s.phase='career';s.draws.careerEvent=drawCareer();update()}}]};break;
case 'career':{const ev=careerEvents[s.draws.careerEvent];d={tag:'CHAPTER 08 · 官僚人生',overline:`${s.ministry} · 入省${s.yearIn+1}年目`,title:ev.title,body:`<div class="mini-grid">${summaryRow('現在の役職',s.rank)}${summaryRow('政策実績',String(s.impact))}${summaryRow('組織からの信頼',String(s.trust))}${summaryRow('倫理・透明性',String(s.integrity))}</div><p>${esc(ev.text)}</p>`,choices:ev.options.map((o,i)=>({label:o[0],sub:o[1],act:()=>careerTurn(i)})),footer:'キャリア進行は約3年単位に圧縮しています。昇進モデル・役職の到達可能性は架空のものです。'};break}
case 'retirement':d={tag:'CHAPTER 09 · 退官',overline:`${s.ministry}での${s.yearIn}年間`,title:'官僚人生の終わり。',body:`<p class="biglead">定年を迎え、後輩に仕事を引き継ぐ日が来た。</p><p>あなたが残した政策や組織での経験は、記録として残っている。</p><div class="mini-grid">${summaryRow('最終役職',s.rank)}${summaryRow('政策実績',String(s.impact))}</div>`,choices:[{label:'人生の最終記録を見る',sub:'エンディングへ',act:finish}]};break;
case 'end':{const ok=s.ending.kind==='win',badges=ok?[s.ministry,s.rank,`勤続${s.yearIn}年`]:[s.examType||'採用挑戦者',`受験${s.examTry}回`,`訪問${s.visitCount}官庁`];d={tag:'CHAPTER 09 · LIFE RECORD',overline:ok?'官僚人生の記録':'GAME OVER',title:s.ending.title,body:`<p class="end-quote">${esc(s.ending.reason)}</p><div class="mini-grid">${summaryRow('出生地',s.region)}${summaryRow('最終学歴',s.school)}${summaryRow('最終年齢',String(s.age)+'歳')}${summaryRow('政策実績',String(s.impact))}</div><div class="badge-row">${badges.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div><p class="smallprint" style="margin-top:20px">ここでの勝敗はゲームのルール上のものであり、現実の人生の価値を評価するものではありません。</p>`,choices:[{label:'もう一度生まれる',sub:'出生条件も能力もすべて再抽選',act:()=>{s=fresh();s.phase='birth';log(`${s.birthYear}年、${s.region}に生まれた`);update()}}]};break}
}
if(d)scene(d);else scene({title:'進行状況を読み込めませんでした',body:'<p>新しい人生を開始してください。</p>',choices:[{label:'新しい人生を始める',act:()=>{s=fresh();update()}}]});}
function toast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.display='none'},2700)}
$('mainArea').addEventListener('click',e=>{const btn=e.target.closest('[data-choose]');if(!btn||btn.disabled||!currentScene)return;const i=Number(btn.getAttribute('data-choose'));const c=currentScene.choices[i];if(!c||typeof c.act!=='function')return;btn.disabled=true;try{c.act()}catch(err){console.error(err);toast('処理に失敗しました。再読み込みで復旧を試してください。');btn.disabled=false}});
$('guideBtn').addEventListener('click',()=>alert('【遊び方】\n出生条件はランダムです。選択によって能力・資金・体調が変わり、入試、試験、官庁訪問の結果に影響します。官僚になれなければゲームオーバー。採用後は退官までのキャリアが続きます。\n\nゲーム上の確率・制度は架空の簡略モデルです。\nゲーム進行はこのブラウザに自動保存されます。'));
$('resetBtn').addEventListener('click',()=>{if(confirm('現在の人生の記録を破棄して、出生条件からやり直しますか？')){s=fresh();update();toast('新しい人生を用意しました')}});
try{const saved=localStorage.getItem(KEY);s=saved?JSON.parse(saved):fresh();if(!s||s.ver!==20||!s.phase||!Array.isArray(s.history)||!s.family)throw Error('invalid save')}catch(e){s=fresh();toast('セーブデータを読み込めず、新規に開始しました')}render();
})();
</script>
</body>
</html>
