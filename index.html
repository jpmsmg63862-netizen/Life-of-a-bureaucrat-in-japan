<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>霞が関の一生 Ver.0.4 Web版 — 官僚人生シミュレーター</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e7edf7;background:#0b1220}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:28px 18px 60px}.eyebrow{color:#92a8c7;letter-spacing:.18em;font-size:12px}h1{font-size:clamp(30px,7vw,52px);margin:8px 0}h2{margin:0 0 14px;font-size:23px}.lead{color:#b4c3d9;line-height:1.8}.panel{background:#152238;border:1px solid #30425c;border-radius:16px;padding:22px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0e192b;padding:12px;border-radius:10px}.stat small{color:#9eafc6;display:block;margin-bottom:5px}.stat strong{font-size:18px}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:48px;cursor:pointer;border:1px solid #456082;background:#243854;color:white;border-radius:10px;padding:13px 16px;font-size:15px;text-align:left;transition:.15s}button:hover{background:#345276}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#e4e9f3;color:#10192a;font-weight:750;text-align:center;border:0}.primary:hover{background:white}.choices{display:grid;gap:10px;margin-top:18px}.choice small{display:block;color:#a8b9d1;margin-top:5px;line-height:1.5}.muted{color:#9caec6}.badge{display:inline-block;border:1px solid #587399;padding:5px 9px;border-radius:20px;font-size:12px;color:#cbd8ea}.progress{height:7px;background:#2d405c;border-radius:5px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#8ab4ef;transition:.3s}.log{font-size:13px;color:#9aacc7;line-height:1.7}.danger{color:#ffa7b4}.success{color:#a8e8c6}.footer{font-size:12px;color:#8296b2;line-height:1.7;margin-top:28px}@media(max-width:530px){.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:17px}}@supports (-webkit-touch-callout:none){button{font-size:16px}.wrap{padding-bottom:calc(60px + env(safe-area-inset-bottom))}} </style></head><body><main class="wrap"><div class="eyebrow">KASUMIGASEKI LIFE / WEB EDITION 0.4 / Safari</div><h1>霞が関の一生</h1><p class="lead">生まれる場所も、家庭も、才能も選べない。<br>国家公務員として採用されなければ、ゲームオーバー。</p><div id="app"><div class="panel">ゲームを読み込み中です…</div></div><div id="error" role="alert" style="display:none" class="panel danger"></div><p class="footer">※これは架空のゲームです。出生分布・学力・大学受験・国家公務員試験・官庁訪問・昇進の確率はゲーム用の仮設定であり、実際の統計や人事評価を示すものではありません。採用要件は職種・年度により異なります。</p></main><script>
const $=q=>document.querySelector(q),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n)),pick=a=>a[rand(0,a.length-1)];let s;
const prefectures=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
const ministries=['財務省','経済産業省','総務省','外務省','厚生労働省','国土交通省','文部科学省','農林水産省','法務省','環境省','内閣府','デジタル庁'];
const randomNormal=()=>{let u=1-Math.random(),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
function init(){let r=Math.random(),family=r<.22?'低所得':r<.83?'中所得':'高所得';let money=family==='低所得'?rand(8,32):family==='中所得'?rand(35,72):rand(75,98);let edu=pick(['支援少なめ','標準','充実']);s={age:0,phase:0,money,talent:clamp(Math.round(52+randomNormal()*17)),health:rand(35,95),study:0,interview:clamp(Math.round(48+randomNormal()*18)),stress:0,attempts:0,career:0,rank:0,history:[],home:pick(prefectures),family,education:edu,school:'未就学',route:'未定',ministry:null,exam:false,visited:[],offer:false,university:null,examScore:0,examChance:0,visitChance:0};s.study=clamp(Math.round(s.talent*.65+money*.15+(edu==='充実'?9:edu==='支援少なめ'?-8:0)+randomNormal()*9));render()}
function note(t){s.history.unshift(`${s.age}歳：${t}`)}function step(n){s.phase=n;render()}function change(d){for(let k in d)s[k]=clamp(s[k]+d[k]);render()}function layout(title,desc,buttons){let progress=Math.min(100,Math.round(s.phase/9*100));$('#app').innerHTML=`<div class="panel"><span class="badge">${s.age}歳 / ${s.phase<5?'人生形成期':s.phase<7?'採用選考期':'官僚キャリア'}</span><div class="progress"><div style="width:${progress}%"></div></div><div class="stats">${[['出生地',s.home],['家庭',s.family],['教育環境',s.education],['大学',s.university||'未定'],['学力',s.study],['健康',s.health],['対人能力',s.interview],['ストレス',s.stress]].map(([k,v])=>`<div class="stat"><small>${k}</small><strong>${v}</strong></div>`).join('')}</div></div><div class="panel"><h2>${title}</h2><p class="lead">${desc}</p><div class="choices">${buttons.map((b,i)=>`<button class="${b.primary?'primary':'choice'}" data-i="${i}">${b.label}${b.sub?`<small>${b.sub}</small>`:''}</button>`).join('')}</div></div>${s.history.length?`<div class="panel"><b>人生の記録</b><div class="log">${s.history.slice(0,7).map(x=>`<div>${x}</div>`).join('')}</div></div>`:''}`;window.currentChoices=buttons}
document.addEventListener("click",function(e){let b=e.target.closest("button[data-i]");if(!b)return;let i=Number(b.getAttribute("data-i"));let item=window.currentChoices&&window.currentChoices[i];if(item&&typeof item.fn==="function"){try{item.fn()}catch(err){showError(err)}}});function showError(err){let box=document.getElementById("error");if(box){box.style.display="block";box.textContent="ゲーム内エラー: "+String(err&&err.message||err)+"。ページを再読み込みしてください。"}}window.addEventListener("error",function(e){showError(e.error||e.message)});function render(){if(!s)return;switch(s.phase){case 0:return layout('あなたが生まれた。',`出生地は${s.home}。家庭の経済状況は「${s.family}」、教育環境は「${s.education}」。能力や家庭環境は抽選で決まった。あなたはまだ自分の将来を知らない。`,[{label:'人生を始める',primary:true,fn:()=>{s.age=6;note('小学校へ入学');step(1)}}]);case 1:return layout('小学校時代',`学習環境をどう活用する？ 家庭の経済状況も学習の機会に影響する。`,[{label:'勉強に打ち込む',sub:'学力が伸びるが、健康に少し負荷',fn:()=>{change({study:rand(10,21),health:-5});s.age=12;note('勉強を優先した');step(2)}},{label:'友人や課外活動を大切にする',sub:'対人能力と健康が伸びる',fn:()=>{change({interview:rand(9,17),health:6,study:3});s.age=12;note('課外活動に励んだ');step(2)}}]);case 2:return layout('中学・高校時代',`現在の学力は${s.study}。進路を選ぼう。`,[{label:'難関大学を目指して受験勉強',sub:'学力が大きく伸び、ストレスが増える',fn:()=>{change({study:rand(14,27),stress:14,health:-6});s.age=18;note('大学受験に挑戦');step(3)}},{label:'勉強と活動を両立',sub:'学力と対人能力をバランスよく育てる',fn:()=>{change({study:rand(5,14),interview:rand(8,16),stress:5});s.age=18;note('勉強と活動を両立');step(3)}}]);case 3:{let preparation=clamp(Math.round(s.study*.72+s.money*.10+(s.education==='充実'?8:s.education==='支援少なめ'?-7:0)));let options=[{name:'東京大学',difficulty:83},{name:'難関大学',difficulty:67},{name:'一般大学',difficulty:43}];let choices=options.map(o=>{let chance=clamp(Math.round(100/(1+Math.exp(-(preparation-o.difficulty)/8))),1,98);return {label:`${o.name}を受験`,sub:`ゲーム内推定合格確率 ${chance}%（実測値ではありません）`,fn:()=>{let pass=Math.random()*100<chance;s.age=19;if(pass){s.school=o.name;s.university=o.name;s.age=23;note(`${o.name}に合格し卒業`);step(4)}else{note(`${o.name}に不合格`);step(31)}}}});choices.push({label:'就職して社会経験を積む',sub:'高卒ルートから採用試験へ',fn:()=>{s.school='高卒';s.university='進学なし';s.age=22;s.interview=clamp(s.interview+12);note('民間企業に就職した');step(4)}});return layout('18歳：大学受験',`受験準備スコア ${preparation}。大学ごとに独立した難易度を設定。表示確率はゲーム内モデルによる仮定です。`,choices)}case 31:return layout('進学に失敗した',`別の道を選ぶこともできる。`,[{label:'再受験する',fn:()=>{s.study=clamp(s.study+rand(4,12));s.age=20;s.school='一般大学';s.university='一般大学';note('再挑戦して大学進学');s.age=24;step(4)}},{label:'就職して公務員を目指す',fn:()=>{s.school='高卒';s.university='進学なし';s.age=22;note('就職して採用試験を目指す');step(4)}}]);case 4:return layout('国家公務員を目指す',`最終学歴：${s.school}。採用区分を選択。ゲームでは受験資格を簡略化している。`,[{label:'国家公務員総合職',sub:'高難度。政策立案・幹部候補のキャリア',fn:()=>{s.route='総合職';step(5)}},{label:'国家公務員一般職',sub:'総合職とは異なる採用・キャリアルート',fn:()=>{s.route='一般職';step(5)}},{label:'国家公務員経験者採用',sub:'社会経験を積んで挑戦（ゲーム上の簡略ルート）',fn:()=>{s.route='経験者';s.age=Math.max(s.age,29);s.interview=clamp(s.interview+10);step(5)}}]);case 5:{let base=s.route==='総合職'?76:s.route==='一般職'?56:68;let academic=s.university==='東京大学'?7:s.university==='難関大学'?4:0;let score=s.study*.72+s.interview*.14+academic-s.stress*.08;let chance=clamp(Math.round(100/(1+Math.exp(-(score-base)/10))),2,95);s.examChance=chance;return layout(`${s.route}採用試験`,`学力 ${s.study}、人物能力 ${s.interview}。ゲーム内最終合格確率 ${chance}%。筆記・人物試験を統合した仮モデル。大学名だけでは合否は決まらない。`,[{label:'受験する',primary:true,fn:()=>{s.attempts++;s.examScore=Math.round(score+randomNormal()*10);if(Math.random()*100<chance){s.exam=true;note(`${s.route}採用試験に最終合格（ゲーム内確率 ${chance}%）`);step(6)}else{note(`${s.route}採用試験に不合格（ゲーム内確率 ${chance}%）`);step(51)}}}])}case 51:return layout('試験不合格',`受験回数：${s.attempts}。再挑戦できるが時間は過ぎていく。`,[{label:'もう一度受験する',fn:()=>{s.age+=1;s.study=clamp(s.study+rand(4,11));s.stress=clamp(s.stress+8);if(s.attempts>=5)step(90);else step(5)}},{label:'別の採用区分を検討',fn:()=>{s.age+=1;step(4)}},{label:'官僚を諦める',fn:()=>step(90)}]);case 6:{let available=ministries.filter(x=>!s.visited.includes(x));return layout('官庁訪問・採用面接',`試験には合格した。しかし、まだ採用は決まっていない。志望官庁を選ぼう。残り訪問可能回数：${Math.max(0,3-s.visited.length)}。官庁訪問の合格率は試験とは独立した仮モデル。`,available.slice(0,12).map(m=>({label:m,fn:()=>{s.ministry=m;s.visited.push(m);step(61)}})))}case 61:return layout(`${s.ministry}：面接`,`「政策に関わる仕事で、あなたが最も重視することは何ですか？」`,[{label:'客観的な根拠に基づく政策立案',fn:()=>interview(12)},{label:'関係者との合意形成',fn:()=>interview(10)},{label:'迅速な政策実行',fn:()=>interview(8)}]);case 62:return layout('官庁訪問：選考結果',`残念ながら${s.ministry}から内々定は得られなかった。`,[{label:'別の官庁を訪問する',fn:()=>s.visited.length>=3?step(63):step(6)},{label:'翌年に再挑戦する',fn:()=>{s.age++;s.visited=[];s.interview=clamp(s.interview+5);step(5)}},{label:'断念する',fn:()=>step(90)}]);case 63:return layout('官庁訪問終了',`今回の訪問では採用に至らなかった。`,[{label:'翌年再挑戦する',fn:()=>{s.age++;s.visited=[];if(s.age>34)step(90);else step(5)}},{label:'採用を断念する',fn:()=>step(90)}]);case 7:return layout('採用内々定！',`${s.ministry}から採用内々定を得た。${s.route}として官僚人生が始まる。`,[{label:'入省する',primary:true,fn:()=>{note(`${s.ministry}に採用`);s.career=0;s.rank=0;step(8)}}]);case 8:{let ranks=['係員','係長級','課長補佐級','企画官級','課長級','審議官級','局長級','事務次官級'];return layout(`${s.age}歳：${ranks[s.rank]}`,`${s.ministry}での勤務${s.career}年目。政策能力と信頼を高めながら、官僚人生を進めよう。現在の役職：${ranks[s.rank]}。`,[{label:'政策立案に全力を注ぐ',sub:'昇進に有利だが負荷が大きい',fn:()=>career(17,15)},{label:'組織内の調整に力を入れる',sub:'対人能力が伸びる',fn:()=>career(11,5)},{label:'健康と生活のバランスを重視',sub:'負荷を抑えて長く働く',fn:()=>career(6,-12)},{label:'退官する',fn:()=>step(9)}])}case 9:{let ranks=['係員','係長級','課長補佐級','企画官級','課長級','審議官級','局長級','事務次官級'];return layout('官僚人生の記録',`あなたは${s.ministry}に採用され、${s.career}年間勤務した。最高到達役職：${ranks[s.rank]}。官僚になるという最初の目標を達成した。`,[{label:'新しい人生を始める',primary:true,fn:init}])}case 90:return layout('GAME OVER',`国家公務員として採用されずに挑戦を終えた。これはゲーム上の敗北であり、人生の価値を意味しない。`,[{label:'出生からやり直す',primary:true,fn:init}]);}}
function interview(bonus){let difficulty=s.route==='総合職'?70:55;let ministryAdj=['財務省','外務省','経済産業省'].includes(s.ministry)?7:0;let score=s.interview*.57+s.study*.23+bonus-s.stress*.07;let chance=clamp(Math.round(100/(1+Math.exp(-(score-difficulty-ministryAdj)/12))),3,92);s.visitChance=chance;let pass=Math.random()*100<chance;if(pass){s.offer=true;note(`${s.ministry}から内々定（ゲーム内確率 ${chance}%）`);step(7)}else{note(`${s.ministry}の選考を通過できなかった（ゲーム内確率 ${chance}%）`);step(62)}}function career(gain,stress){s.career+=3;s.age+=3;s.stress=clamp(s.stress+stress);s.health=clamp(s.health-(stress>0?rand(2,8):0)+(stress<0?5:0));let p=clamp(15+gain+s.study*.25+s.interview*.15-s.rank*10-s.stress*.15,4,80);if(Math.random()*100<p&&s.rank<7){s.rank++;note('昇進した')}else note('異動と政策業務を経験した');if(s.age>=65||s.health<=5)step(9);else render()}init();
</script></body></html>
