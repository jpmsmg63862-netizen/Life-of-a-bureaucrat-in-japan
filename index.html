<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>霞が関の一生 | Life of a Bureaucrat</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#e7edf8;background:#0b1120}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer;touch-action:manipulation}header{padding:18px max(18px,calc((100vw - 940px)/2));background:#111b30;border-bottom:1px solid #26364e;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{letter-spacing:.08em}header small{color:#9baeca}main{max-width:940px;margin:auto;padding:20px 16px 90px}.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(245px,1fr);gap:16px}.panel{background:#131f34;border:1px solid #2b3c55;border-radius:17px;padding:20px;margin-bottom:16px}.eyebrow{color:#91b2e9;font-size:12px;letter-spacing:.13em;font-weight:700}.muted{color:#a9b8d0;line-height:1.75}.lead{font-size:18px;line-height:1.8}.title{font-size:clamp(25px,5vw,39px);line-height:1.35;margin:10px 0 16px}.pill{display:inline-block;background:#203450;color:#bad6ff;border:1px solid #365577;padding:5px 10px;border-radius:30px;font-size:12px}.choices{display:grid;gap:10px;margin-top:22px}.choice{width:100%;text-align:left;background:#1c2c46;border:1px solid #39506e;color:#eef4ff;padding:15px;border-radius:12px;line-height:1.6}.choice:active{transform:scale(.99)}.choice b{display:block}.choice small{display:block;color:#a7bbd5;margin-top:4px}.primary{background:#9dc4ff;color:#0b1830;border:0;border-radius:10px;padding:12px 16px;font-weight:800}.ghost{background:#22324b;color:#d6e5fa;border:1px solid #3c506a;border-radius:10px;padding:10px 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.stat{margin:14px 0}.statline{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.track{height:7px;background:#2d3b50;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#6f9bde,#b9d4ff)}.log{max-height:340px;overflow:auto;font-size:12px;color:#b7c5da;line-height:1.7}.log div{border-bottom:1px solid #2 (()=>{'use strict';const KEY='kasumigaseki-life-v10';const $=x=>document.getElementById(x),clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)];const pref=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];const ministries=['財務省','経済産業省','総務省','外務省','厚生労働省','国土交通省','農林水産省','文部科学省','法務省','環境省','内閣府','金融庁','デジタル庁','警察庁'];let s;const initial=()=>({age:0,phase:'intro',birthYear:rnd(1988,2005),pref:pick(pref),family:pick(['生活困窮','低所得','中間層','中間層','中間層','比較的裕福','富裕層']),parents:pick(['中学校卒','高校卒','高校卒','大学卒','大学卒','大学院卒']),traits:{学力:rnd(18,64),体力:rnd(35,85),精神:rnd(35,85),対人:rnd(25,75),政策:rnd(20,65),資金:rnd(18,60)},log:[],step:0,school:'未進学',degree:'なし',gpa:0,prep:0,exam:null,visits:0,offer:false,ministry:null,rank:'未採用',years:0,merit:0,trust:40,failures:0,ending:false,flag:{}});const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const record=t=>{s.log.unshift(`${s.age}歳｜${t}`);s.log=s.log.slice(0,60)};const mod=(obj)=>{for(const [k,v] of Object.entries(obj)){if(k in s.traits)s.traits[k]=clamp(s.traits[k]+v);else s[k]=(s[k]||0)+v}};function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1500)};const choice=(title,desc,fn)=>({title,desc,fn});function screen(title,body,choices=[],note='',tag='人生の分岐'){let html=`<div class="panel"><div class="topline"><span class="eyebrow">${tag}</span><span class="pill">${s.age}歳 / ${s.birthYear+s.age}年</span></div><h1 class="title">${title}</h1><div class="lead">${body}</div>${note?`<div class="note">${note}</div>`:''}<div class="choices">${choices.map((c,i)=>`<button class="choice" data-choice="${i}"><b>${c.title}</b><small>${c.desc||''}</small></button>`).join('')}</div></div>`;$('game').innerHTML=html;document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{let c=choices[Number(el.dataset.choice)];c.fn();save();render()})}
function nextAge(age,phase){s.age=age;s.phase=phase;s.step=0}function go(phase){s.phase=phase;s.step=0}function end(title,desc){s.ending=true;s.phase='end';s.endTitle=title;s.endDesc=desc;record(title)}
function render(){let stats=Object.entries(s.traits).map(([k,v])=>`<div class="stat"><div class="statline"><span>${k}</span><b>${Math.round(v)}</b></div><div class="track"><div class="fill" style="width:${v}%"></div></div></div>`).join('');$('profile').innerHTML=`<p class="muted">${s.pref}生まれ<br>家庭：${s.family}<br>親の学歴：${s.parents}<br>学校：${s.school}<br>採用：${s.ministry||'未採用'}<br>役職：${s.rank}</p>${stats}`;$('history').innerHTML=s.log.map(x=>`<div>${x}</div>`).join('')||'<p>まだ記録がありません。</p>';if(s.phase==='intro')return screen('生まれた瞬間から、勝負は始まる。','あなたの出生地、家庭環境、能力は選べない。学校を選び、試験を突破し、官庁訪問を乗り越えろ。<br><br><strong>採用されなければゲームオーバー。</strong>', [choice('出生する','ランダムな人生を開始',()=>{go('birth');record(`${s.pref}の${s.family}家庭に生まれた`)})],'選択による結果は固定ではなく、能力値と運が作用します。','NEW LIFE');if(s.phase==='birth')return screen('あなたが生まれた。',`${s.birthYear}年、${s.pref}。家庭は「${s.family}」、親の最終学歴は「${s.parents}」。<br><br>あなたはまだ、霞が関という言葉すら知らない。`,[choice('幼少期へ','0〜6歳',()=>{let bonus=({'生活困窮':-10,'低所得':-5,'中間層':3,'比較的裕福':10,'富裕層':16})[s.family];mod({資金:bonus});nextAge(6,'child')})]);if(s.phase==='child'){let events=[['幼少期の時間','家庭の事情により、自由な時間の使い方が変わる。'],['学校への準備','小学校入学が近づいてきた。']];let e=events[s.step]||events[0];return screen(e[0],e[1],[choice('読書と学習に取り組む','学力＋、体力が少し下がる',()=>{mod({学力:rnd(6,12),体力:-3});record('幼少期に学習習慣を身につけた');advanceChild()}),choice('外で遊び、友人と過ごす','体力・対人＋',()=>{mod({体力:rnd(5,10),対人:rnd(3,8)});record('友人との時間を大切にした');advanceChild()}),choice('好きなことに没頭する','政策・精神＋',()=>{mod({政策:rnd(3,9),精神:5});record('好奇心を育てた');advanceChild()})]);}
if(s.phase==='junior'){let prompts=[['中学校に入学','勉強と部活動の両立が課題になる。'],['高校受験が迫る','進学校を目指すか、自分に合った進路を選ぶか。']];let e=prompts[s.step]||prompts[0];return screen(e[0],e[1],[choice('勉強を優先する','学力・政策＋ / 精神－',()=>{mod({学力:rnd(9,16),政策:3,精神:-5});advanceJunior()}),choice('バランスを取る','学力・体力・対人＋',()=>{mod({学力:rnd(4,9),体力:5,対人:5});advanceJunior()}),choice('部活動や活動実績に注力','対人・体力＋',()=>{mod({対人:9,体力:8,学力:-3});advanceJunior()})]);}
if(s.phase==='high'){let e=[['高校生活が始まる','学力だけでなく、家庭の経済事情や学校の進路指導も影響する。'],['進路選択の年','大学受験のために何を犠牲にするか。'],['大学入試','どの進路に挑むかを決める。']][s.step];if(s.step===2){let power=s.traits.学力+s.prep+({'生活困窮':-10,'低所得':-5,'中間層':0,'比較的裕福':4,'富裕層':7})[s.family];return screen('大学受験',`現在の学力指標：${Math.round(power)}。進路を選択してください。`,[choice('東京大学に挑戦','極めて難関。失敗時は別大学への進学判定',()=>uniAttempt('東京大学',clamp((power-60)*1.4,1,70))),choice('難関大学に挑戦','挑戦的な進路',()=>uniAttempt('難関大学',clamp((power-43)*1.7,8,88))),choice('地域の大学に進学','進学可能性が比較的高い',()=>uniAttempt('一般大学',clamp((power-20)*1.5,25,95))),choice('就職・専門学校へ','大学卒業資格を必要としない採用経路もある',()=>{s.school='高校卒';nextAge(19,'work')})],'確率はゲーム内の仮定です。実際の大学入試の合格率ではありません。');}return screen(e[0],'勉強、課外活動、経済事情の中で進路を組み立てる。',[choice('受験勉強に集中','学力・受験準備＋',()=>{mod({学力:rnd(7,13),精神:-5});s.prep+=8;advanceHigh()}),choice('学校生活と両立','対人・学力＋',()=>{mod({学力:6,対人:7,体力:3});s.prep+=3;advanceHigh()}),choice('アルバイトで学費を貯める','資金＋、受験準備は控えめ',()=>{mod({資金:12,学力:3,精神:-3});advanceHigh()})]);}
if(s.phase==='uni'){let events=[['大学1年','授業、サークル、アルバイト。どこに時間を使う？'],['大学2年','専門分野と将来の方向性を考える。'],['大学3年','ゼミ、インターン、国家公務員試験の準備。'],['大学4年','受験準備の総仕上げ。']];let e=events[Math.min(s.step,3)];return screen(e[0],e[1],[choice('勉強・研究に注力','学力・政策・GPA＋',()=>{mod({学力:8,政策:8,精神:-3});s.gpa+=.7;advanceUni()}),choice('課外活動とインターン','対人・政策・GPA少量＋',()=>{mod({対人:9,政策:6,体力:-3});s.gpa+=.35;advanceUni()}),choice('アルバイトと生活の安定','資金・精神＋',()=>{mod({資金:10,精神:5});s.gpa+=.2;advanceUni()})]);}
if(s.phase==='work')return screen('社会に出た。','大学卒業以外のルートからも公務員採用に挑戦できる。ただし、応募要件は採用区分・年度によって異なる。',[choice('一般職試験を目指す','試験準備に進む',()=>{s.examType='一般職';go('examPrep')}),choice('就労経験を積む','経験者採用を目指す',()=>{mod({対人:9,政策:5,資金:8});nextAge(27,'experience')}),choice('官僚への道を諦める','ゲームオーバー',()=>end('GAME OVER','国家公務員への挑戦を終えた。'))]);if(s.phase==='experience')return screen('社会人からの挑戦','これまでの職務経験を武器に、採用選考に挑む。',[choice('経験者採用に挑戦','選考へ',()=>{s.examType='経験者採用';go('examPrep')}),choice('挑戦を終える','ゲームオーバー',()=>end('GAME OVER','官僚になる夢を断念した。'))]);
if(s.phase==='examSelect')return screen('国家公務員試験を選ぶ','採用試験の最終合格と官庁からの採用は別。区分ごとの特徴を考えて挑戦する。',[choice('総合職（教養区分）','政策構想・論述・人物評価を重視するゲームモデル',()=>{s.examType='総合職・教養';go('examPrep')}),choice('総合職（法律区分）','法律知識と政策能力を重視するゲームモデル',()=>{s.examType='総合職・法律';go('examPrep')}),choice('総合職（経済区分）','経済知識と政策能力を重視するゲームモデル',()=>{s.examType='総合職・経済';go('examPrep')}),choice('一般職','別の採用ルートを選ぶ',()=>{s.examType='一般職';go('examPrep')})]);
if(s.phase==='examPrep')return screen(`${s.examType}：受験準備`,'試験対策に時間を使う。学力だけでなく体力や精神状態にも注意が必要。',[choice('徹底的に試験対策','学力＋、精神－',()=>{mod({学力:10,精神:-7});go('examFirst')}),choice('計画的に勉強する','学力・精神＋',()=>{mod({学力:6,精神:3});go('examFirst')}),choice('人物対策・面接練習','対人・政策＋',()=>{mod({対人:9,政策:5});go('examFirst')})]);
if(s.phase==='examFirst'){let score=s.traits.学力*.7+s.traits.政策*.3+rnd(-18,18)+(s.school==='東京大学'?5:0),threshold=s.examType==='一般職'?45:s.examType==='経験者採用'?51:60;return screen('一次試験',`模擬試験の結果が出る。<br><strong>評価スコア：${Math.round(score)} / 基準：${threshold}</strong>`,[choice('結果を確認する',score>=threshold?'一次試験通過':'一次試験不合格',()=>{if(score>=threshold){record(`${s.examType}の一次試験を突破`);go('examSecond')}else failExam()})],'得点と基準は実際の国家公務員試験とは異なるゲーム用指標です。');}
if(s.phase==='examSecond'){let score=s.traits.政策*.4+s.traits.対人*.35+s.traits.精神*.25+rnd(-20,20),pass=score>=49;return screen('二次試験・人物評価','政策課題の説明、論述、人物面接が行われた。',[choice('最終結果を見る',pass?'最終合格':'不合格',()=>{if(pass){record(`${s.examType}に最終合格`);go('visitSelect')}else failExam()})],'最終合格しても採用は確約されません。');}
if(s.phase==='retry')return screen('不合格。次の進路は？',`これまでの不合格回数：${s.failures}回。挑戦を続けるか決める。`,[choice('翌年もう一度挑戦する','年齢＋1、学力・政策が少し上昇',()=>{s.age++;mod({学力:4,政策:3,精神:-4});go('examSelect')}),choice('経験を積んでから再挑戦','年齢＋3、政策・対人が上昇',()=>{s.age+=3;mod({政策:8,対人:8,資金:5});go('examSelect')}),choice('挑戦を終える','ゲームオーバー',()=>end('GAME OVER','国家公務員として採用されることなく、挑戦を終えた。'))]);
if(s.phase==='visitSelect')return screen('官庁訪問：志望省庁を選ぶ',`最終合格した。ここからが採用選考の本番。<br>官庁訪問の挑戦回数：${s.visits}`,ministries.slice(0,10).map(m=>choice(m,'政策分野や組織との適合性を問われる',()=>{s.ministryCandidate=m;go('visit1')})).concat([choice('ほかの官庁から選ぶ','内閣府・金融庁・デジタル庁・警察庁',()=>go('visitOther'))]));if(s.phase==='visitOther')return screen('官庁訪問：その他の官庁','訪問先を選択する。',ministries.slice(10).map(m=>choice(m,'志望動機と政策理解を問われる',()=>{s.ministryCandidate=m;go('visit1')})));
if(s.phase==='visit1')return screen(`${s.ministryCandidate}：第1面接`,'「なぜ、民間企業ではなく国家公務員なのですか？」',[choice('公共的課題を制度設計から解決したい','政策への関心を示す',()=>visitAnswer(0,7,4)),choice('大きな影響力を持つ仕事がしたい','動機の具体性を問われる',()=>visitAnswer(0,0,2)),choice('大学の研究を政策に活かしたい','経験と志望の接続を示す',()=>visitAnswer(0,5,3))],'選択肢だけで内定は決まりません。能力値・面接の一貫性・運も反映されます。');if(s.phase==='visit2')return screen(`${s.ministryCandidate}：政策面接`,'「政策の効果が不確実で、利害関係者が対立しています。どう進めますか？」',[choice('データと反対意見を集め、選択肢を比較する','調整力と分析力を示す',()=>visitAnswer(1,8,5)),choice('上司の方針に従い、迅速に進める','組織的な対応を優先',()=>visitAnswer(1,1,2)),choice('自分の信念に基づき強く推進する','主体性はあるが調整が課題',()=>visitAnswer(1,3,0))]);if(s.phase==='visit3'){let fit=(s.flag.visitScore||0)+s.traits.政策*.27+s.traits.対人*.25+s.traits.精神*.13+rnd(-20,16);let pass=fit>=58;return screen(`${s.ministryCandidate}：最終判断`,`複数回の面接を終えた。採用担当者から連絡が届く。`,[choice('選考結果を開く',pass?'内々定の連絡':'今回は採用見送り',()=>{s.visits++;if(pass){s.offer=true;s.ministry=s.ministryCandidate;s.rank='係員';s.age=Math.max(22,s.age);record(`${s.ministry}から内々定を獲得`);go('hired')}else{record(`${s.ministryCandidate}の官庁訪問で不採用`);s.flag.visitScore=0;go('visitFail')}})],'面接結果はゲーム用モデル。実際の省庁の採用基準ではありません。');}if(s.phase==='visitFail')return screen('官庁訪問：採用見送り','最終合格しても、希望官庁から採用されるとは限らない。',[choice('別の官庁を訪問する','残る選択肢を探す',()=>go('visitSelect')),choice('翌年度に再挑戦する','試験制度・受験資格は年度ごとに確認が必要',()=>{s.age++;go('examSelect')}),choice('官僚への挑戦を終える','ゲームオーバー',()=>end('GAME OVER','官庁訪問で採用を得られなかった。'))]);
if(s.phase==='hired')return screen('採用内定。霞が関へ。',`${s.ministry}に採用された。ここからは政策、人事、国会、そして自身の生活との長い付き合いが始まる。`,[choice('官僚人生を始める','配属先での最初の1年へ',()=>{go('career');s.years=0})],'採用時点で第一目標クリア。退官までのキャリアは続きます。','CAREER START');
if(s.phase==='career'){if(s.age>=65)return endAndRender();let event=careerEvent();return screen(`${s.ministry}｜${s.rank}`,`<span class="pill">入省${s.years+1}年目</span><br><br>${event.title}<br><br>${event.body}`,event.options.map((x,i)=>choice(x[0],x[1],()=>{mod(x[2]);s.merit+=x[3];s.trust=clamp(s.trust+x[4]);record(`${event.title}：${x[0]}`);s.age++;s.years++;careerPromote();if(s.age>=65)go('retire')})),`政策実績 ${s.merit}｜組織内信頼 ${s.trust}。役職は実際の昇進制度を簡略化したものです。`,'BUREAUCRATIC CAREER')}
if(s.phase==='retire')return screen('退官の日',`${s.ministry}で${s.years}年間勤務。最終役職は「${s.rank}」。政策実績：${s.merit}、信頼：${s.trust}。`,[choice('人生の記録を見る','エンディングへ',()=>end('退官エンド',`${s.ministry}で${s.rank}として官僚人生を終えた。`))]);if(s.phase==='end')return screen(s.endTitle,`${s.endDesc}<br><br>出生地：${s.pref}<br>最終学歴：${s.school}<br>到達役職：${s.rank}<br>試験不合格：${s.failures}回<br>官庁訪問：${s.visits}回`,[choice('もう一度生まれる','出生条件を再抽選',()=>{s=initial()})],'この結果はゲーム上の評価であり、現実の人生の価値を示すものではありません。','LIFE RECORD')}
function advanceChild(){s.step++;if(s.step>=2){nextAge(12,'junior');record('小学校を卒業した')}else s.age=9}function advanceJunior(){s.step++;if(s.step>=2){let score=s.traits.学力+rnd(-20,20);s.school=score>=60?'進学校':'高校';nextAge(16,'high');record(`${s.school}へ進学`)}else s.age=15}function advanceHigh(){s.step++;s.age=s.step===1?17:18}function uniAttempt(name,rate){if(rnd(1,100)<=rate){s.school=name;record(`${name}に合格`)}else{s.school=pick(['一般大学','一般大学','短期大学']);record(`${name}に不合格。${s.school}へ進学`)}nextAge(19,'uni');s.gpa=0}function advanceUni(){s.step++;s.age++;if(s.step>=4){s.degree=s.school==='短期大学'?'短大卒':'大卒';s.gpa=Math.round(clamp(s.gpa,0,4)*100)/100;record(`${s.school}を卒業（GPA ${s.gpa}）`);go('examSelect')}}function failExam(){s.failures++;record(`${s.examType}に不合格`);if(s.failures>=5||s.age>=40)end('GAME OVER','採用への挑戦を続けたが、今回は官僚になれなかった。');else go('retry')}function visitAnswer(step,policy,social){s.flag.visitScore=(s.flag.visitScore||0)+policy+social;mod({政策:Math.max(0,Math.floor(policy/3)),対人:Math.max(0,Math.floor(social/3))});record(`${s.ministryCandidate}で面接に回答`);go(step===0?'visit2':'visit3')}function careerPromote(){const steps=[[3,'係長',12],[8,'課長補佐',35],[15,'企画官',62],[22,'課長',100],[28,'審議官',150],[33,'局長',195],[37,'事務次官',250]];for(const [yr,rank,merit] of steps){if(s.years===yr&&s.merit+s.trust*.4+rnd(-30,20)>=merit){s.rank=rank;record(`${rank}に昇進した`)}}}function careerEvent(){let bank=[{title:'国会対応が続く',body:'答弁資料の作成と政策の整合性確認が重なっている。',options:[['資料の精度を優先','政策＋、体力－',{政策:5,体力:-7,精神:-4},8,3],['チームで役割を分担','対人＋、体力－',{対人:5,体力:-3},5,7],['期限を守ることを優先','体力維持、政策成果は控えめ',{体力:2},2,-3]]},{title:'制度改正の検討',body:'現行制度には問題があるが、関係団体から反対意見も出ている。',options:[['エビデンスを集める','政策能力＋',{政策:7,精神:-4},9,2],['関係者の合意形成を進める','対人能力＋',{対人:7,体力:-3},7,6],['現状維持を提案する','負担は小さい',{精神:3},1,-2]]},{title:'地方自治体への出向打診',body:'本省を離れて現場経験を積む機会がある。',options:[['出向を希望する','政策・対人＋',{政策:6,対人:5},8,3],['本省に残る','組織内信頼＋',{精神:-4},5,5],['専門分野の研究を優先','政策＋',{政策:8,対人:-2},6,0]]},{title:'緊急政策対応',body:'予想外の社会情勢の変化で迅速な政策対応が求められている。',options:[['現場の声を優先','対人＋',{対人:6,体力:-6},8,3],['迅速な制度設計を進める','政策＋、体力－',{政策:7,体力:-8},10,1],['持続可能な対応を組む','精神維持',{精神:4,政策:3},6,2]]},{title:'若手職員の育成',body:'部下が仕事の進め方に悩んでいる。',options:[['時間をかけて指導する','対人＋、体力－',{対人:7,体力:-4},6,8],['裁量を与える','信頼が変動',{対人:3},5,3],['自分の業務を優先','政策＋、信頼－',{政策:4},4,-5]]},{title:'政策評価の年',body:'これまでの政策の効果を検証する時期になった。',options:[['失敗を含めて公開する','信頼・政策＋',{政策:6,精神:-4},9,6],['成功事例を重点的に説明','評価は安定しやすい',{対人:3},5,0],['追加調査を求める','慎重な判断',{政策:5,体力:-3},7,2]]}];let e=bank[(s.years+Math.floor(s.traits.政策/15))%bank.length];return e}function endAndRender(){go('retire');render()}
$('reset').onclick=()=>{if(confirm('現在の人生を終了して、出生からやり直しますか？')){s=initial();save();render()}};try{s=JSON.parse(localStorage.getItem(KEY))||initial();if(!s.traits||!s.phase)throw Error('invalid')}catch(e){s=initial()}render();})();</script></body></html>
